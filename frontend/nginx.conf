server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access: the browser only ever talks to this origin,
    # nginx forwards /api/* to the monitor service over the compose network.
    location /api/ {
        proxy_pass http://monitor:8000/;
    }

    location / {
        try_files $uri /index.html;
    }
}
